crons:
  - name: weekly-digest
    description: "Emails each grower a weekly plant-health summary every Monday at 8am IST"
    cron: "0 8 * * 1"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest"
    method: POST
    enabled: true
